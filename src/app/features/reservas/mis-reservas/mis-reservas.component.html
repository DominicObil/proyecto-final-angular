<div class="reservas-bg">
  <div class="reservas-container">
    <h2>Gestiona tus reservas</h2>
    <div *ngIf="error" class="error-message">{{ error }}</div>
    <div *ngIf="reservas.length > 0; else sinReservas">
      <div *ngFor="let r of reservas" class="reserva-card">
        <div class="reserva-card-img">
          <img
            *ngIf="r.restauranteImagen"
            [src]="r.restauranteImagen"
            alt="Imagen restaurante"
            class="restaurante-img"
          />
        </div>
        <div class="reserva-card-info">
  <div class="restaurante-nombre">{{ r.restauranteNombre }}</div>
          <div class="reserva-fecha">
            {{ r.fechaReserva | date: 'EEEE, d ' }}de {{ r.fechaReserva | date: 'MMMM' }}, {{ r.horaReserva }}
          </div>
          <div class="reserva-personas">
            {{ r.numeroPersonas }} persona{{ r.numeroPersonas > 1 ? 's' : '' }}
          </div>
        </div>
        <div class="reserva-card-actions">
          <button class="reserva-btn editar" (click)="editarReserva(r.id)">Modificar</button>
          <button class="reserva-btn eliminar" (click)="borrarReserva(r.id)">Eliminar</button>
        </div>
      </div>
    </div>
    <ng-template #sinReservas>
      <div class="sin-reservas">
        <p>No tienes reservas aún.</p>
        <a routerLink="/restaurants" class="reserva-btn call-to-action">Reservar ahora</a>
      </div>
    </ng-template>
  </div>
</div>
