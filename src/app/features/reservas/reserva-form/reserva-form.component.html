<div class="reserva-fullpage">
  <div class="reserva-left">
    <div class="reserva-img-bg">
      <div class="reserva-overlay"></div>
      <div class="reserva-msg">
        <h1>Reserva tu mesa<br>en segundos</h1>
        <p>Elige el restaurante, la fecha y la hora que te convenga.</p>
      </div>
    </div>
  </div>
  <div class="reserva-right">
    <div class="reserva-form-panel">
      <h2>Reserva tu mesa</h2>
      <div *ngIf="restauranteNombre" class="restaurante-nombre">
        <span>{{ restauranteNombre }}</span>
      </div>
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="reserva-form">
        <div class="form-row">
          <div class="form-group">
            <label>Fecha*</label>
            <input type="date" formControlName="fechaReserva" required />
          </div>
          <div class="form-group">
            <label>Hora*</label>
            <input type="time" formControlName="horaReserva" required />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Número de personas*</label>
            <input type="number" min="1" formControlName="numeroPersonas" required />
          </div>
        </div>
        <div class="form-group full-width">
          <label>Observaciones</label>
          <input type="text" formControlName="comentarios" placeholder="(Opcional)" />
        </div>
        <button type="submit" class="main-button" [disabled]="form.invalid || loading">
          {{ loading ? 'Reservando...' : 'Reservar mesa' }}
        </button>
      </form>
      <div *ngIf="success" class="success-message">{{ success }}</div>
      <div *ngIf="error" class="error-message">{{ error }}</div>
    </div>
  </div>
</div>
