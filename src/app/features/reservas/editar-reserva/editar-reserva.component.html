<div class="reserva-wrapper">
  <!-- Columna izquierda: mensaje de bienvenida -->
  <div class="reserva-welcome">
    <h1>¡Edita tu reserva en segundos!</h1>
    <p>Revisa tus datos, haz los cambios necesarios y confirma.<br>
  </div>

  <!-- Columna derecha: formulario de edición -->
  <div class="reserva-form-panel">
    <h2>Editar reserva</h2>
    <div *ngIf="restauranteNombre" class="restaurante-nombre">
      <strong>{{ restauranteNombre }}</strong>
    </div>
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="reserva-form">
      <div class="form-group">
        <label>Fecha*</label>
        <input
          type="date"
          formControlName="fechaReserva"
          required
        />
      </div>
      <div class="form-group">
        <label>Hora*</label>
        <input
          type="time"
          formControlName="horaReserva"
          required
        />
      </div>
      <div class="form-group">
        <label>Número de personas*</label>
        <input
          type="number"
          min="1"
          formControlName="numeroPersonas"
          required
        />
      </div>
      <div class="form-group">
        <label>ID Turno*</label>
        <input
          type="number"
          formControlName="turnoId"
          required
        />
      </div>
      <div class="form-group">
        <label>Observaciones</label>
        <input
          type="text"
          formControlName="comentarios"
        />
      </div>
      <button
        type="submit"
        class="reserva-btn"
        [disabled]="form.invalid || loading"
      >
        {{ loading ? 'Guardando...' : 'Guardar cambios' }}
      </button>
      <button
        type="button"
        class="cancel-btn"
        (click)="irAMisReservas()"
      >
        Cancelar
      </button>
    </form>
    <div *ngIf="success" class="success-message">{{ success }}</div>
    <div *ngIf="error" class="error-message">{{ error }}</div>
  </div>
</div>
