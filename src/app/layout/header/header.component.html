<header class="header">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <div class="header-logo">
    <a routerLink="/">SavoirTable</a>
  </div>

  <!-- Botón hamburguesa -->
  <button class="hamburger" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen" aria-label="Menú">
    <i class="fas fa-bars"></i>
  </button>

  <!-- Menú de navegación -->
  <nav class="header-nav" [class.open]="menuOpen">
    <ul>
      <!-- SOLO PARA ROLE = USER -->
      <li *ngIf="isLoggedIn && userRole === 'USER'">
        <a routerLink="/restaurants" (click)="closeMenu()">Restaurantes</a>
      </li>
      <li *ngIf="isLoggedIn && userRole === 'USER'">
        <a routerLink="/mis-reservas" (click)="closeMenu()">Mis Reservas</a>
      </li>

      <!-- SOLO PARA ROLE = ADMIN -->
      <li *ngIf="isLoggedIn && userRole === 'ADMIN'">
        <a routerLink="/panel-solicitudes" (click)="closeMenu()">Solicitudes</a>
      </li>

      <!-- SOLO PARA ROLE = OWNER -->
      <li *ngIf="isLoggedIn && userRole === 'OWNER'">
        <a routerLink="/mis-restaurantes" (click)="closeMenu()">Mis restaurantes</a>
      </li>

      <!-- VISIBLE PARA OWNER Y USER -->
      <li *ngIf="isLoggedIn && (userRole === 'OWNER' || userRole === 'USER')">
        <a routerLink="/solicitar-restaurante" (click)="closeMenu()">Únete</a>
      </li>
    </ul>
  </nav>

  <!-- Acciones (login, registro, logout) -->
  <div class="header-actions" *ngIf="!menuOpen">
    <button class="btn-outline" (click)="irALogin()" *ngIf="!isLoggedIn">Iniciar sesión</button>
    <button class="btn-primary" (click)="irARegistro()" *ngIf="!isLoggedIn">Registrarse</button>
    <button class="btn-logout" (click)="logout()" *ngIf="isLoggedIn">Logout</button>
  </div>
</header>
